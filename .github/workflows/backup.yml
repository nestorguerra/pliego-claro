name: Copia de seguridad cifrada

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Volcado de esquema y datos (incluye usuarios de Auth)
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$PROJECT_REF" ]; then echo "::warning::Faltan secretos de copia."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/copia"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f "$RUNNER_TEMP/copia/esquema.sql"
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f "$RUNNER_TEMP/copia/datos.sql"
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only -f "$RUNNER_TEMP/copia/roles.sql"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/copia.tgz" copia
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/copia.tgz" -out "$RUNNER_TEMP/pliego-claro-copia.tgz.enc" -pass env:BACKUP_PASSPHRASE
          # Prueba de recuperación: se descifra y se comprueba que el volcado contiene las tablas clave.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/pliego-claro-copia.tgz.enc" -pass env:BACKUP_PASSPHRASE | tar -xzO copia/esquema.sql | grep -q "CREATE TABLE.*expedientes"
          rm -rf "$RUNNER_TEMP/copia" "$RUNNER_TEMP/copia.tgz"
          sha256sum "$RUNNER_TEMP/pliego-claro-copia.tgz.enc"
      - uses: actions/upload-artifact@v4
        if: env.BACKUP_PASSPHRASE != ''
        with:
          name: copia-cifrada-${{ github.run_id }}
          path: ${{ runner.temp }}/pliego-claro-copia.tgz.enc
          retention-days: 14
          if-no-files-found: ignore
