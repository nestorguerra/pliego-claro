name: Sincronizar PLACSP y avisos

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      backfill_pages:
        description: "Páginas a leer la primera vez (≈400 licitaciones por página)"
        default: "8"

permissions:
  contents: read

concurrency:
  group: sync-placsp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "certifi==2025.8.3"
      - name: Obtener la clave secreta del proyecto (enmascarada, no se guarda)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GIVEN_SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$GIVEN_SECRET" ]; then echo "SUPABASE_SECRET_KEY=$GIVEN_SECRET" >> "$GITHUB_ENV"; exit 0; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "::warning::Faltan secretos de Supabase: no se sincroniza."; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/api-keys?reveal=true", headers={"Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}"})
          keys = json.load(urllib.request.urlopen(req))
          key = next((k["api_key"] for k in keys if k.get("type") == "secret" and k.get("api_key")), None) or next((k["api_key"] for k in keys if k.get("name") == "service_role" and k.get("api_key")), None)
          if not key:
              raise SystemExit("No se encontró una clave secreta en el proyecto.")
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SUPABASE_SECRET_KEY={key}\n")
          PY
      - name: Leer la fuente oficial, registrar cambios y enviar avisos
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BACKFILL_PAGES: ${{ inputs.backfill_pages || '8' }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then echo "::warning::Sin SUPABASE_SECRET_KEY: no se sincroniza."; exit 0; fi
          python sync/run_sync.py
